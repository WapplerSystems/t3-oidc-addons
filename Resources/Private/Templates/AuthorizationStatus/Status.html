<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="Main">

    <f:if condition="{showLoginSuccessMessage}">
        <div class="alert alert-success"><f:translate key="LLL:EXT:oidc_addons/Resources/Private/Languages/locallang.xlf:msg.loginSuccessfull" /></div>
    </f:if>
    <f:if condition="{showLogoutSuccessMessage}">
        <div class="alert alert-success"><f:translate key="LLL:EXT:oidc_addons/Resources/Private/Languages/locallang.xlf:msg.logoutSuccessfull" /></div>
    </f:if>


    <f:if condition="{isLoggedIn}">
        <f:then>
            <a class="btn btn-primary" href="{logoutLink}"><f:translate key="LLL:EXT:oidc_addons/Resources/Private/Languages/locallang.xlf:btn.logout" /></a>
        </f:then>
        <f:else>
            <f:link.page pageUid="{settings.oidcPluginPageId}" class="btn btn-primary"><f:translate key="LLL:EXT:oidc_addons/Resources/Private/Languages/locallang.xlf:btn.login" /></f:link.page>
        </f:else>
    </f:if>

</f:section>



</html>
